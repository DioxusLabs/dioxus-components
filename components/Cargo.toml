[package]
name = "dioxus-components"
version = "0.0.1"
edition = "2021"
rust-version = "1.92.0"
description = "Styled, accessible components for Dioxus, built on dioxus-primitives."
readme = "README.md"
keywords = ["gui", "dioxus", "components", "ui"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/components"

[dependencies]
dioxus.workspace = true
dioxus-icons.workspace = true
dioxus-primitives = { workspace = true, features = ["router"] }
palette = "0.7.6"
time = { version = "0.3.44", features = ["std", "macros"] }

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
web = ["dioxus-primitives/web"]
