[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus-primitives = { path = "primitives" }
tracing = { version = "0.1", features = ["std"] }

dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "e2cc82e63f3f44f92dfddbae8c6b4dde2d65d1e8" }
dioxus-rsx = { git = "https://github.com/DioxusLabs/dioxus", rev = "e2cc82e63f3f44f92dfddbae8c6b4dde2d65d1e8" }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "e2cc82e63f3f44f92dfddbae8c6b4dde2d65d1e8" }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
