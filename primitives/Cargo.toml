[package]
name = "dioxus-primitives"
version = "0.0.1"
edition = "2021"
rust-version = "1.92.0"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/components"

[dependencies]
dioxus.workspace = true
dioxus-attributes = { path = "../dioxus-attributes" }
dioxus-sdk-time.workspace = true
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"] }
num-integer = "0.1.46"
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
palette = "0.7.6"

[build-dependencies]
lazy-js-bundle.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, optional = true }
dioxus-native = { version = "=0.8.0-alpha.3", optional = true }
dioxus-native-dom = { version = "=0.8.0-alpha.3", optional = true }

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
default = ["router"]
native = ["dep:blitz-dom", "dep:dioxus-native", "dep:dioxus-native-dom"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]
