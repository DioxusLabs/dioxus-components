[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus = "=0.8.0-alpha.4"
dioxus-code = { version = "=0.2.0-alpha.3", default-features = false }
dioxus-i18n = "=0.7.0-alpha.1"
dioxus-icons = "=0.2.0-alpha.3"
dioxus-primitives = { path = "primitives" }
dioxus-rsx = "=0.8.0-alpha.4"
dioxus-ssr = "=0.8.0-alpha.4"
dioxus-timers = "=0.8.0-alpha.4"
dioxus-vdom = "=0.8.0-alpha.4"
lazy-js-bundle = "=0.8.0-alpha.4"
tracing = { version = "0.1", features = ["std"] }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1

# Companion crates' alpha.4 bumps are not published yet; drop once they are.
[patch.crates-io]
dioxus-code = { git = "https://github.com/DioxusLabs/dioxus-code", rev = "b20d3d4575c36f4b3c4fe9432b002b20da6beb9b" }
dioxus-icons = { git = "https://github.com/DioxusLabs/dioxus-icons", rev = "cd6381f6a25c43ed027cd1eb5510ee09bff6b152" }
