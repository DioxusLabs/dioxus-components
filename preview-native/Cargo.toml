[package]
name = "preview-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"

[dependencies]
dioxus.workspace = true
dioxus-native = { workspace = true, features = ["accessibility", "hot-reload", "net", "html", "svg", "system-fonts", "file-dialog", "woff", "text-transform-icu", "apple-font-embolden"] }
dioxus-primitives = { workspace = true, features = ["native"] }
preview = { path = "../preview" }

[features]
default = ["dioxus-native/vello-gpu"]
