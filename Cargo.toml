[workspace]
resolver = "3"
members = [
    "primitives",
    "preview",
    "preview-web",
    "preview-native",
    "test-harness",
    "dioxus-attributes",
]

[workspace.dependencies]
dioxus = "=0.8.0-alpha.3"
dioxus-code = { version = "=0.2.0-alpha.3", default-features = false }
dioxus-i18n = "=0.7.0-alpha.1"
dioxus-icons = "=0.2.0-alpha.3"
dioxus-native = { version = "=0.8.0-alpha.3", features = ["prelude"] }
dioxus-primitives = { path = "primitives" }
dioxus-rsx = "=0.8.0-alpha.3"
dioxus-sdk-time = "=0.8.0-alpha.3"
dioxus-ssr = "=0.8.0-alpha.3"
lazy-js-bundle = "=0.8.0-alpha.3"
tracing = { version = "0.1", features = ["std"] }

[profile.release]
debug = false
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1

[patch.crates-io]
const-serialize = { git = "https://github.com/DioxusLabs/dioxus", rev = "c1921a20aeb61e2426c710800a972b83649cac7e" }
