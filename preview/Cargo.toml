[package]
name = "preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-code = { workspace = true, features = ["macro", "lang-css"] }
dioxus-icons.workspace = true
dioxus-primitives.workspace = true
dioxus-i18n.workspace = true
dioxus-timers.workspace = true
fastrand = { version = "2", features = ["js"] }
palette = "0.7.6"
unic-langid = { version = "0.9", features = ["macros"] }
strum = { version = "0.27.2", features = ["derive"] }
tracing = { workspace = true }
time = { version = "0.3.44", features = ["std", "macros"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false, optional = true }
dirs = { version = "7", optional = true }

[build-dependencies]
dioxus = { workspace = true }
dioxus-code = { workspace = true, features = ["runtime", "lang-css"] }
dioxus-ssr.workspace = true
pulldown-cmark = "0.13.0"
serde_json = "1"

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
web = ["dioxus/web", "dioxus-primitives/web"]
desktop = ["dioxus/desktop"]
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack"]
native = ["dioxus/native", "dep:arboard", "dep:dirs"]
